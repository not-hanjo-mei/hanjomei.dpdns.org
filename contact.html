<!DOCTYPE html>
<html>

<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title i18n="contact_page_title">Contact - Hanjo Mei's Cyber Crib</title>
    <link href="https://fonts.googleapis.com/css?family=Product+Sans:400,500,700&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<script src="js/jquery-min.js"></script>
<script src="js/jquery.i18n.js"></script>

<body>
    <div class="header">
        <h1 id="terminalEffect"
            style="text-align: left; margin-left: 20px; transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);">
        </h1>
    </div>

    <!-- Sidebar (optional, can be loaded dynamically) -->
    <div class="sidebar" id="sidebar">
        <!-- Sidebar content can go here (loaded dynamically) -->
    </div>

    <!-- Main Content for Donations -->
    <div class="main-content" id="mainContent">
        <div class="card" id="contact">
            <h2 i18n="get_in_touch">Get in Touch</h2>
            <p i18n="contact_description">Feel free to reach out to me for collaborations or just to say hi!</p>

            <div class="social-links" style="justify-content: flex-start; margin-bottom: 20px;">
                <a href="https://twitter.com/not_hanjo_mei" class="social-link" target="_blank">
                    <img src="images/icons/x-twitter.svg" alt="X/Twitter" class="social-icon">
                    <span i18n="twitter">X / Twitter</span>
                </a>
                <a href="https://instagram.com/not_hanjo_mei" class="social-link" target="_blank">
                    <img src="images/icons/instagram.svg" alt="Instagram" class="social-icon">
                    <span i18n="instagram">Instagram</span>
                <a href="https://discord.gg/GGtAM42A4S" class="social-link" target="_blank">
                    <img src="images/icons/discord.svg" alt="Discord" class="social-icon">
                    <span i18n="discord_server">Discord Server</span>
                </a>
                <a href="https://youtube.com/@hanjo_mei_reality" class="social-link" target="_blank">
                    <img src="images/icons/youtube.svg" alt="YouTube" class="social-icon">
                    <span i18n="youtube">YouTube</span>
                </a>
                </a>
                <a href="https://reality.app/profile/be1378b4-5aa0-4534-b0be-2e7084c610e3" class="social-link"
                    target="_blank">
                    <img src="images/icons/reality.svg" alt="REALITY" class="social-icon">
                    <span i18n="reality">REALITY</span>
                </a>
                <a href="https://space.bilibili.com/1838177170" class="social-link" target="_blank">
                    <img src="images/icons/bilibili.svg" alt="Bilibili" class="social-icon">
                    <span i18n="bilibili">Bilibili</span>
                </a> <a href="https://github.com/not-hanjo-mei" class="social-link" target="_blank">
                    <img src="images/icons/github.svg" alt="GitHub" class="social-icon">
                    <span i18n="github">GitHub</span>
                </a>
                <a href="mailto:hanjomei@hanjomei.dpdns.org" class="social-link" target="_blank">
                    <i class="material-icons" style="width: 20px; height: 20px; font-size: 20px;">email</i>
                    <span i18n="email_button">Email</span>
                </a>
            </div>

            <p><i class="material-icons">email</i> <span i18n="email">Email: hanjomei@hanjomei.dpdns.org</span></p>
        </div>
    </div>

    <div id="floating-button"></div>

    <script src="js/scripts.js"></script>
</body>

</html>
