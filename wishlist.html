<!DOCTYPE html>
<html>

<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title i18n="wishlist_page_title">Wishlist - Hanjo Mei's Cyber Crib</title>
  <link href="https://fonts.googleapis.com/css?family=Product+Sans:400,500,700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .wishlist-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .wishlist-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .wishlist-stats {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .stat-card {
      background: var(--surface-color);
      padding: 20px;
      border-radius: 12px;
      box-shadow: var(--elevation-1);
      text-align: center;
      min-width: 120px;
    }

    .stat-number {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 0.9rem;
      color: var(--text-color);
      opacity: 0.7;
    }

    .filter-controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .filter-button {
      padding: 8px 16px;
      border: 2px solid var(--primary-color);
      background: transparent;
      color: var(--primary-color);
      border-radius: 20px;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
    }

    .filter-button.active,
    .filter-button:hover {
      background: var(--primary-color);
      color: var(--on-primary-color);
    }

    .wishlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .wishlist-item {
      background: var(--surface-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: var(--elevation-1);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .wishlist-item:hover {
      box-shadow: var(--elevation-2);
      transform: translateY(-2px);
    }

    .wishlist-item.fulfilled {
      opacity: 0.7;
    }

    .wishlist-item.fulfilled::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(45deg, transparent 40%, rgba(76, 175, 80, 0.1) 50%, transparent 60%);
      pointer-events: none;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 15px;
    }

    .item-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin: 0;
      color: var(--text-color);
    }

    .item-status {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .priority-badge {
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
    }

    .priority-high {
      background: rgba(244, 67, 54, 0.15);
      color: #d32f2f;
    }

    .priority-medium {
      background: rgba(255, 152, 0, 0.15);
      color: #f57c00;
    }

    .priority-low {
      background: rgba(76, 175, 80, 0.15);
      color: #388e3c;
    }

    .fulfilled-badge {
      background: rgba(76, 175, 80, 0.15);
      color: #388e3c;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .item-description {
      color: var(--text-color);
      opacity: 0.8;
      margin-bottom: 15px;
      line-height: 1.4;
    }    .item-details {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .item-price {
      font-weight: 600;
      color: var(--text-color);
      font-size: 1.1rem;
    }

    .item-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-date {
      font-size: 0.8rem;
      color: var(--text-color);
      opacity: 0.6;
    }

    .item-link {
      background: var(--primary-color);
      color: var(--on-primary-color);
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.9rem;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .item-link:hover {
      background: #3367d6;
      transform: translateY(-1px);
    }

    .no-items {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-color);
      opacity: 0.6;
    }

    .no-items i {
      font-size: 4rem;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    @media (max-width: 768px) {
      .wishlist-stats {
        gap: 15px;
      }

      .stat-card {
        min-width: 100px;
        padding: 15px;
      }

      .filter-controls {
        gap: 10px;
      }

      .filter-button {
        padding: 6px 12px;
        font-size: 0.9rem;
      }

      .wishlist-grid {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .item-details {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<script src="other_scripts_blyat/jquery-min.js"></script>
<script src="other_scripts_blyat/jquery.i18n.js"></script>

<body>
  <div class="header">
    <h1 id="terminalEffect"
      style="text-align: left; margin-left: 20px; transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);"></h1>
  </div>

  <div class="sidebar" id="sidebar"></div>

  <div class="main-content" id="mainContent">
    <div class="wishlist-container">
      <div class="wishlist-header">
        <h1 i18n="wishlist_title">My Wishlist</h1>
        <p i18n="wishlist_description">Things I'm hoping to get someday</p>
      </div>

      <div class="wishlist-stats" id="wishlistStats">
        <!-- Stats will be populated by JavaScript -->
      </div>      <div class="filter-controls">
        <button class="filter-button active" data-filter="all" i18n="filter_all">All</button>
        <button class="filter-button" data-filter="pending" i18n="filter_pending">Pending</button>
        <button class="filter-button" data-filter="fulfilled" i18n="filter_fulfilled">Fulfilled</button>
        <button class="filter-button" data-filter="high" i18n="filter_high_priority">High Priority</button>
      </div>

      <div class="wishlist-grid" id="wishlistGrid">
        <!-- Wishlist items will be populated by JavaScript -->
      </div>

      <div class="no-items" id="noItems" style="display: none;">
        <i class="material-icons">sentiment_dissatisfied</i>
        <h3 i18n="no_items_found">No items found</h3>
        <p i18n="no_items_description">Try adjusting your filters</p>
      </div>
    </div>  </div>

  <div id="floating-button"></div>

  <script src="scripts.js"></script>
  <script>
    let wishlistData = [];
    let currentFilter = 'all';

    // Load wishlist data
    async function loadWishlistData() {
      try {
        const response = await fetch('wishlist-data.json');
        const data = await response.json();
        wishlistData = data.items;
        updateStats();
        renderWishlist();
      } catch (error) {
        console.error('Error loading wishlist data:', error);
        document.getElementById('wishlistGrid').innerHTML = 
          '<div class="no-items"><h3>Error loading wishlist data</h3></div>';
      }
    }    // Update statistics
    function updateStats() {
      const total = wishlistData.length;
      const fulfilled = wishlistData.filter(item => item.fulfilled).length;
      const pending = total - fulfilled;
      const highPriority = wishlistData.filter(item => item.priority === 'high' && !item.fulfilled).length;
      
      // Calculate total price for pending items
      const pendingItems = wishlistData.filter(item => !item.fulfilled);
      const totalPendingPrice = pendingItems.reduce((sum, item) => {
        // Extract numeric value from price string (e.g., "$1200" -> 1200)
        const price = parseFloat(item.price.replace(/[^0-9.]/g, '')) || 0;
        return sum + price;
      }, 0);

      const statsHtml = `
        <div class="stat-card">
          <div class="stat-number">${total}</div>
          <div class="stat-label" i18n="stat_total">Total Items</div>
        </div>
        <div class="stat-card">
          <div class="stat-number">${pending}</div>
          <div class="stat-label" i18n="stat_pending">Pending</div>
        </div>
        <div class="stat-card">
          <div class="stat-number">${fulfilled}</div>
          <div class="stat-label" i18n="stat_fulfilled">Fulfilled</div>
        </div>
        <div class="stat-card">
          <div class="stat-number">$${totalPendingPrice.toLocaleString()}</div>
          <div class="stat-label" i18n="stat_total_price">Total Price</div>
        </div>
        <div class="stat-card">
          <div class="stat-number">${highPriority}</div>
          <div class="stat-label" i18n="stat_high_priority">High Priority</div>
        </div>
      `;

      document.getElementById('wishlistStats').innerHTML = statsHtml;
    }// Filter and sort wishlist items
    function filterItems() {
      const filtered = wishlistData.filter(item => {
        switch (currentFilter) {
          case 'all':
            return true;
          case 'pending':
            return !item.fulfilled;
          case 'fulfilled':
            return item.fulfilled;
          case 'high':
            return item.priority === 'high';
          default:
            return true;
        }
      });

      // Sort by: 1. Fulfilled status (pending first), 2. Priority (high > medium > low), 3. Alphabetically by title
      return filtered.sort((a, b) => {
        // First sort by fulfilled status (pending items first)
        if (a.fulfilled !== b.fulfilled) {
          return a.fulfilled ? 1 : -1;
        }

        // Then sort by priority
        const priorityOrder = { 'high': 0, 'medium': 1, 'low': 2 };
        const priorityDiff = priorityOrder[a.priority] - priorityOrder[b.priority];
        if (priorityDiff !== 0) {
          return priorityDiff;
        }

        // Finally sort alphabetically by title
        return a.title.localeCompare(b.title);
      });
    }

    // Render wishlist items
    function renderWishlist() {
      const filteredItems = filterItems();
      const grid = document.getElementById('wishlistGrid');
      const noItems = document.getElementById('noItems');

      if (filteredItems.length === 0) {
        grid.style.display = 'none';
        noItems.style.display = 'block';
        return;
      }

      grid.style.display = 'grid';
      noItems.style.display = 'none';

      const itemsHtml = filteredItems.map(item => `
        <div class="wishlist-item ${item.fulfilled ? 'fulfilled' : ''}">
          <div class="item-header">
            <h3 class="item-title">${escapeHtml(item.title)}</h3>
            <div class="item-status">
              <span class="priority-badge priority-${item.priority}">${item.priority}</span>
              ${item.fulfilled ? '<span class="fulfilled-badge"><i class="material-icons" style="font-size: 0.8rem;">check</i>Done</span>' : ''}
            </div>
          </div>          <p class="item-description">${escapeHtml(item.description)}</p>
          <div class="item-details">
            <span class="item-price">${escapeHtml(item.price)}</span>
          </div>
          <div class="item-footer">
            <span class="item-date">Added: ${formatDate(item.added_date)}</span>
            ${item.link ? `<a href="${escapeHtml(item.link)}" target="_blank" class="item-link">
              <i class="material-icons" style="font-size: 1rem;">open_in_new</i>
              View
            </a>` : ''}
          </div>
        </div>
      `).join('');

      grid.innerHTML = itemsHtml;
    }

    // Utility functions
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString();
    }

    // Event listeners
    document.addEventListener('DOMContentLoaded', function() {
      loadWishlistData();

      // Filter buttons
      document.querySelectorAll('.filter-button').forEach(button => {
        button.addEventListener('click', function() {
          document.querySelectorAll('.filter-button').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          currentFilter = this.dataset.filter;
          renderWishlist();
        });
      });
    });
  </script>
</body>

</html>
