<!DOCTYPE html>
<html>

<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title i18n="wishlist_page_title">Wishlist - Hanjo Mei's Cyber Crib</title>  <link href="https://fonts.googleapis.com/css?family=Product+Sans:400,500,700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/wishlist.css">
</head>

<script src="js/jquery-min.js"></script>
<script src="js/jquery.i18n.js"></script>

<body>
  <div class="header">
    <h1 id="terminalEffect"
      style="text-align: left; margin-left: 20px; transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);"></h1>
  </div>

  <div class="sidebar" id="sidebar"></div>

  <div class="main-content" id="mainContent">
    <div class="wishlist-container">
      <div class="wishlist-header">
        <h1 i18n="wishlist_title">My Wishlist</h1>
        <p i18n="wishlist_description">Things I'm hoping to get someday</p>
      </div>

      <div class="wishlist-stats" id="wishlistStats">
        <!-- Stats will be populated by JavaScript -->
      </div>      <div class="filter-controls">
        <button class="filter-button active" data-filter="all" i18n="filter_all">All</button>
        <button class="filter-button" data-filter="pending" i18n="filter_pending">Pending</button>
        <button class="filter-button" data-filter="fulfilled" i18n="filter_fulfilled">Fulfilled</button>
        <button class="filter-button" data-filter="high" i18n="filter_high_priority">High Priority</button>
      </div>

      <div class="wishlist-grid" id="wishlistGrid">
        <!-- Wishlist items will be populated by JavaScript -->
      </div>

      <div class="no-items" id="noItems" style="display: none;">
        <i class="material-icons">sentiment_dissatisfied</i>
        <h3 i18n="no_items_found">No items found</h3>
        <p i18n="no_items_description">Try adjusting your filters</p>
      </div>
    </div>  </div>
  <div id="floating-button"></div>
  <script src="js/scripts.js"></script>
  <script src="js/wishlist.js"></script>
</body>

</html>
